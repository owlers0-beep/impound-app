<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إدارة السيارات المحجوزة</title>
<style>
:root{--bg:#F5F2EA;--fg:#172A34;--card:#fff;--pri:#BF7936;--mut:#5F6E75;--bd:#E0D9CB;--acc:#F1E6D4;--accf:#5C3D20;--sec:#ECE5D8;--dst:#B64E42;--hdr:#172A34;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10191E;--fg:#F1EEE6;--card:#1A2830;--mut:#A3B0B6;--bd:#2B3B44;--acc:#3A2A1A;--accf:#F1E6D4;--sec:#24343D;--hdr:#0B1216}}
:root[data-theme=dark]{--bg:#10191E;--fg:#F1EEE6;--card:#1A2830;--mut:#A3B0B6;--bd:#2B3B44;--acc:#3A2A1A;--accf:#F1E6D4;--sec:#24343D;--hdr:#0B1216}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",Tahoma,sans-serif}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:90px}
header{background:var(--hdr);color:#fff;padding:22px 20px;display:flex;gap:12px;align-items:center}
header img{width:44px;height:auto}
h1{margin:0;font-size:21px}h2{font-size:15px;margin:6px 0}
.sub{font-size:13px;opacity:.85}
main{padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mut{color:var(--mut);font-size:13px}
.badge{background:var(--acc);color:var(--accf);font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px}
.hero{background:var(--pri);color:#fff;border-radius:18px;padding:16px}
.hero b{font-size:34px}
.stats{display:flex;gap:10px}.stat{flex:1;text-align:center}.stat b{display:block;font-size:26px}
button,input,textarea{font-family:inherit;font-size:15px}
.btn{border:0;border-radius:14px;min-height:48px;padding:10px 14px;font-weight:700;cursor:pointer;background:var(--hdr);color:#fff}
.btn.pri{background:var(--pri)}.btn.sec{background:var(--sec);color:var(--fg)}.btn.dst{background:var(--dst)}
input,textarea{border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:12px;padding:11px 12px;min-height:44px;box-sizing:border-box;width:100%}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600}
.err{color:var(--dst);font-size:13px;min-height:18px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{max-width:480px;margin:0 auto;display:flex}
nav button{flex:1;border:0;background:none;color:var(--mut);min-height:56px;font-weight:600;font-size:13px;cursor:pointer}
nav button.on{color:var(--pri)}
#print{display:none}.rep table{width:100%;border-collapse:collapse}.rep th,.rep td{border:1px solid #999;padding:6px;text-align:right;font-size:13px;white-space:nowrap}.rep .h{display:flex;align-items:center;gap:12px;margin-bottom:12px}.rep img{width:48px}
@media print{body>#app,nav{display:none}#print{display:block;color:#000;background:#fff;padding:20px}#print table{width:100%;border-collapse:collapse}#print th,#print td{border:1px solid #999;padding:6px;text-align:right;font-size:13px}#print .h{display:flex;align-items:center;gap:12px;margin-bottom:14px}#print img{width:60px}}
</style>
</head>

<div id="app"></div>
<nav><div id="nav"></div></nav>
<div id="print"></div>

function makePdf(jpgs){const enc=new TextEncoder(),parts=[],offs=[];let len=0;
const push=b=>{if(typeof b==='string')b=enc.encode(b);parts.push(b);len+=b.length};
const obj=(n,fn)=>{offs[n]=len;push(n+' 0 obj\n');fn();push('\nendobj\n')};
push('%PDF-1.4\n');const N=jpgs.length;
obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
obj(2,()=>push('<< /Type /Pages /Count '+N+' /Kids ['+jpgs.map((_,i)=>(3+3*i)+' 0 R').join(' ')+'] >>'));
jpgs.forEach((j,i)=>{const p=3+3*i,c='q 595 0 0 842 0 0 cm /Im0 Do Q';
obj(p,()=>push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im0 '+(p+2)+' 0 R >> >> /Contents '+(p+1)+' 0 R >>'));
obj(p+1,()=>push('<< /Length '+c.length+' >>\nstream\n'+c+'\nendstream'));
obj(p+2,()=>{push('<< /Type /XObject /Subtype /Image /Width '+j.w+' /Height '+j.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+j.data.length+' >>\nstream\n');push(j.data);push('\nendstream')})});

return new Blob(parts,{type:'application/pdf'})}

let xr=R;cells.forEach((v,j)=>{x.strokeRect(xr-cols[j][1],y,cols[j][1],rh);const dir=(j===0||j>=5)?'ltr':'rtl';ls[j].forEach((s,n)=>D(s,xr-12,y+LH*(n+1)+2,dir));xr-=cols[j][1]});y+=rh});
if(!l.length){x.font='26px '+F;x.fillStyle='#5F6E75';D('لا توجد سجلات.',R-12,y+40)}
const jp=pages.map((p,i)=>{const g=p.getContext('2d');g.fillStyle='#5F6E75';g.font='22px '+F;g.direction='ltr';g.textAlign='center';g.fillText((i+1)+' / '+pages.length,W/2,H-40);
const b=atob(p.toDataURL('image/jpeg',0.92).split(',')[1]),u=new Uint8Array(b.length);for(let n=0;n<b.length;n++)u[n]=b.charCodeAt(n);return{data:u,w:W,h:H}});
return makePdf(jp)}
async function saveFile(blob,name){const P=window.Capacitor&&Capacitor.Plugins;
if(P&&P.Filesystem&&P.Share){const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(blob)});
const w=await P.Filesystem.writeFile({path:name,data:b64,directory:'CACHE'});await P.Share.share({title:name,url:w.uri,dialogTitle:'تصدير PDF'});return}
const f=new File([blob],name,{type:'application/pdf'});
if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()}
async function exportPdf(){const m=document.getElementById('msg');m.textContent='جاري إنشاء الملف...';
try{const blob=await buildReportPdf(rk);await saveFile(blob,(rk==='imp'?'impounded':'released')+'-report-'+new Date().toISOString().slice(0,10)+'.pdf');m.textContent=''}
catch(e){m.textContent=e&&e.name==='AbortError'?'':'تعذر إنشاء الملف.'}}
function repText(k){const l=k==='imp'?imp():rel(),t=k==='imp'?'تقرير السيارات المحجوزة حالياً':'تقرير السيارات المفرج عنها';return t+'\n'+fmt(new Date())+'\n\n'+(l.map((c,i)=>`${i+1}) ${c.model} | ${c.color} | ${c.plate_number} | ${c.reason} | ${fmt(c.entry_date)}${k==='rel'?' ← '+fmt(c.exit_date):''}`).join('\n')||'لا توجد سجلات.')}
async function shareReport(){const text=repText(rk),title='إدارة السيارات المحجوزة',m=document.getElementById('msg');
try{const S=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Share;if(S){await S.share({title,text,dialogTitle:title});return}
if(navigator.share){await navigator.share({title,text});return}}catch(e){if(e&&e.name==='AbortError')return}
try{await navigator.clipboard.writeText(text);m.textContent='تم نسخ التقرير، الصقه في أي تطبيق.'}catch(e){m.textContent='تعذرت المشاركة على هذا الجهاز.'}}
function printReport(){try{window.print()}catch(e){}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
if(a==='go'){tab=b.dataset.t;pend=null;err='';render()}
else if(a==='rel'){const id=b.dataset.id;if(pend===id){const c=cars.find(x=>x.id===id);c.status='RELEASED';c.exit_date=new Date().toISOString();save();pend=null}else pend=id;render()}
else if(a==='view'){rk=b.dataset.k;tab='report';render();scrollTo(0,0)}else if(a==='pdf')exportPdf();else if(a==='share')shareReport();else if(a==='print')printReport()});

document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,v=n=>f.elements[n].value.trim();
if(!['o','m','c','p','r'].every(n=>v(n))){document.querySelector('.err').textContent='أكمل جميع البيانات المطلوبة قبل الحفظ.';return}
cars.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),company_or_owner:v('o'),model:v('m'),color:v('c'),plate_number:v('p'),reason:v('r'),entry_date:new Date().toISOString(),exit_date:null,status:'IMPOUNDED'});
save();err='';tab='home';render()});
